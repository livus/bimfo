# Builds and signs the firmware for a version tag (v1.0.0 = version.txt), publishes it as a
# GitHub release and puts the browser flasher with the same firmware on GitHub Pages.
# One-time setup (see README, "Releasing"):
#   Settings -> Pages -> Source: "GitHub Actions"
#   Settings -> Environments -> "release": required reviewer, tags v*, and the secret
#   BIMFO_SIGNING_KEY (the release key PEM). The build waits for approval before it can
#   read the key.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      # The build runs in Docker with the workspace mounted, so the key goes there
      # (ignored by git) and is removed right after.
      - name: Put the signing key in place
        env:
          KEY: ${{ secrets.BIMFO_SIGNING_KEY }}
        run: |
          umask 077
          printf '%s\n' "$KEY" > release-signing-key.pem

      - name: Build, sign and package the firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          command: idf.py build && python tools/release.py --key release-signing-key.pem --tag ${{ github.ref_name }}

      - name: Remove the signing key
        if: always()
        run: sudo rm -f release-signing-key.pem

      # The build ran as root in Docker; the Pages upload changes file modes.
      - name: Take over the build output
        run: sudo chown -R "$(id -u):$(id -g)" dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          gh release create "$GITHUB_REF_NAME" dist/release/* \
            --title "Bimfo ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Install from the browser: ${site}

          - \`bimfo-update.bin\`: update over Wi-Fi on the settings page (System → Firmware-Datei hochladen). Keeps the settings. Devices with automatic updates switched on install it at night.
          - \`bimfo-full.bin\`: whole flash image for esptool at address 0x0, for a first install. Erases the settings.
          - Licences: \`LICENSE\` (firmware, MIT) and \`THIRD_PARTY_NOTICES.md\` (components it contains)."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
